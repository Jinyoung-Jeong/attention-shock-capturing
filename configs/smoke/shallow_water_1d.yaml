problem: shallow_water_1d
data:
  directory: artifacts/smoke/data
  grid_size: 32
  reference_factor: 1
  reference_cfl: 0.2
  gravity: 1.0
  base_cfl: 0.4
  base_frames: 12
  train_samples: 8
  validation_samples: 4
  test_samples: 4
  split_seeds: {train: 3101, validation: 3201, test: 3301}
model: {d_model: 16, heads: 4, decoder_width: 16, gravity: 1.0, query_skip: true, consistent_flux: false}
training:
  seeds: [2027, 2028, 2029]
  batch_size: 2
  epochs: 1
  iterations_per_epoch: 2
  learning_rate: 1.0e-4
  minimum_learning_rate: 1.0e-6
  weight_decay: 1.0e-5
  gradient_clip: 1.0
  gradient_weight: 2.0
  component_scales: [1.0, 0.5]
  rollout_min: 2
  rollout_max: 2
  strides: [1, 2, 3, 4]
  validation_stride: 4
  validation_steps: 2
  maximum_loss: 1.0e6
  deterministic: false
evaluation: {method_label: CFL-conditioned attention, batch_size: 2, cfl_values: [0.4, 0.8, 1.2, 1.6], diagnostic_cfl: 1.6, timing_samples: 2, timing_warmup: 0, timing_repeats: 1}
output: {directory: artifacts/smoke/runs}
