problem: burgers_1d
data:
  directory: artifacts/smoke/data
  grid_size: 32
  base_cfl: 0.4
  base_frames: 12
  train_samples: 8
  validation_samples: 4
  test_samples: 4
  lax_hopf_quadrature: 2
  split_seeds: {train: 1101, validation: 1201, test: 1301}
model:
  architecture: ordered_stencil_mlp
  stencil_mlp_width: 13
training:
  seeds: [2027, 2028, 2029]
  batch_size: 2
  epochs: 1
  iterations_per_epoch: 2
  learning_rate: 1.0e-4
  minimum_learning_rate: 1.0e-6
  weight_decay: 1.0e-5
  gradient_clip: 1.0
  gradient_weight: 2.0
  rollout_min: 2
  rollout_max: 2
  strides: [1, 2, 3, 4]
  validation_stride: 4
  validation_steps: 2
  maximum_loss: 1.0e6
  deterministic: false
evaluation:
  method_label: Parameter-matched ordered-stencil MLP
  batch_size: 2
  cfl_values: [0.4, 0.8, 1.2, 1.6]
  diagnostic_cfl: 1.6
  timing_samples: 2
  timing_warmup: 0
  timing_repeats: 1
output: {directory: artifacts/smoke/control_runs}
