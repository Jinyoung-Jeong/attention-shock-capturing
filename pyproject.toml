[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transport-attention-fv"
version = "0.1.0"
description = "CFL-conditioned attention fluxes for conservative finite-volume shock transport"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.14,<3",
  "numpy>=1.24",
  "scipy>=1.12",
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/Jinyoung-Jeong/attention-shock-capturing"
Releases = "https://github.com/Jinyoung-Jeong/attention-shock-capturing/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/transport_attention_fv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
